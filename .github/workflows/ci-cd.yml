# Revisar cada pull request; publicar en dev al fusionar en la rama dev
# y en prod al fusionar en main. Diseño: docs/implementacion/ci-cd.md
name: CI/CD

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  revisar:
    name: Revisar
    runs-on: ubuntu-latest
    # Si llega un push nuevo al mismo pull request, se cancela la revisión vieja.
    concurrency:
      group: revisar-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  recorridos:
    name: Recorridos y accesibilidad
    runs-on: ubuntu-latest
    concurrency:
      group: recorridos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Claves de prueba (las de Turnstile siempre dejan pasar). Nunca las de dev ni las de prod.
      - run: cp .dev.vars.example .dev.vars
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Si algo falla, el informe con capturas y trazas queda para descargar desde la corrida.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  publicar-dev:
    name: Publicar en dev
    needs: [revisar, recorridos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Una publicación por vez; nunca se cancela una a la mitad.
    concurrency:
      group: publicar-dev
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Primero la base: la app nueva siempre la encuentra lista.
      - run: npx wrangler d1 migrations apply DB --remote --env dev -c wrangler.jsonc
      - run: npm run build
        env:
          CLOUDFLARE_ENV: dev
      - run: npx wrangler deploy

  publicar-prod:
    name: Publicar en prod
    needs: [revisar, recorridos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote -c wrangler.jsonc
      - run: npm run build
      - run: npx wrangler deploy
